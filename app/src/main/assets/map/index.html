<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #map {
            width: 100%;
            height: 100%;
            background-color: #0b1118;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            touch-action: pan-x pan-y pinch-zoom;
        }
        .leaflet-control-attribution, .leaflet-control-zoom { display: none !important; }
        
        /* Clean, high-clarity Dark Mode Filter */
        .dark-tiles .leaflet-tile {
            filter: invert(100%) hue-rotate(195deg) brightness(95%) contrast(90%) saturate(0.6);
            -webkit-filter: invert(100%) hue-rotate(195deg) brightness(95%) contrast(90%) saturate(0.6);
        }

        .light-tiles .leaflet-tile {
            filter: brightness(100%);
            -webkit-filter: brightness(100%);
        }
        .car-marker-container {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .car-radar-pulse {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0, 229, 255, 0.35);
            animation: radar-anim 1.8s infinite ease-out;
        }
        .car-pointer-disc {
            width: 30px;
            height: 30px;
            background: #07111c;
            border: 2.5px solid #00e5ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 16px rgba(0, 229, 255, 1);
            z-index: 2;
        }
        .car-heading-arrow {
            width: 0; 
            height: 0; 
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 13px solid #00e5ff;
            transform-origin: center 70%;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes radar-anim {
            0% { transform: scale(0.45); opacity: 1; }
            100% { transform: scale(1.9); opacity: 0; }
        }

        /* Destination Crimson Marker */
        .dest-marker {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #ff5252, #d50000);
            border: 2.5px solid #ffffff;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 4px 18px rgba(213, 0, 0, 0.85);
        }
    </style>
</head>
<body class="dark-tiles">
    <div id="map"></div>
    <script>
        // High-Clarity Google Maps Terrain Tile Layer (No API Key Required for Raster)
        var topoTileUrl = 'https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}';
        var currentTileLayer;
        var carMarker = null;
        var destMarker = null;
        var routePolylineBg = null;
        var routePolyline = null;
        var userLatLng = null;
        var isNavigating = false;
        var currentSteps = [];

        function initMap() {
            if (typeof L === 'undefined') {
                setTimeout(initMap, 150);
                return;
            }
            
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false,
                fadeAnimation: true,
                inertia: true,
                zoomAnimation: true
            }).setView([12.9716, 77.5946], 17);

            // Default to topo tiles
            currentTileLayer = L.tileLayer(topoTileUrl, {
                maxZoom: 19,
                subdomains: ['a', 'b', 'c'],
                crossOrigin: true
            }).addTo(map);

            // Tap anywhere on map to pin destination & route
            map.on('click', function(e) {
                var lat = e.latlng.lat;
                var lng = e.latlng.lng;
                window.setDestination(lat, lng, 'Pinned Destination');
                if (window.AndroidBridge && window.AndroidBridge.onDestinationFound) {
                    window.AndroidBridge.onDestinationFound('Pinned Destination', lat.toFixed(4) + ', ' + lng.toFixed(4), lat, lng);
                }
            });

            window.isMapInitialized = true;
        }

        var animationFrameId = null;

        function animateMarker(marker, startLatLng, endLatLng, duration) {
            var startTime = performance.now();
            function step(currentTime) {
                var elapsed = currentTime - startTime;
                var progress = Math.min(elapsed / duration, 1);
                var currentLat = startLatLng[0] + (endLatLng[0] - startLatLng[0]) * progress;
                var currentLng = startLatLng[1] + (endLatLng[1] - startLatLng[1]) * progress;
                
                marker.setLatLng([currentLat, currentLng]);
                
                if (progress < 1) {
                    animationFrameId = requestAnimationFrame(step);
                }
            }
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(step);
        }

        // Realtime continuous location & bearing update from Android GPS
        window.updateLocation = function(lat, lng, bearing, follow) {
            if (!map) return;
            var isFirstLoc = !userLatLng;
            var newLatLng = [lat, lng];
            
            if (!carMarker) {
                userLatLng = newLatLng;
                var carIcon = L.divIcon({
                    className: 'custom-car-icon',
                    html: '<div class="car-marker-container"><div class="car-radar-pulse"></div><div class="car-pointer-disc"><div class="car-heading-arrow" id="carArrow" style="transform: rotate(' + (bearing || 0) + 'deg);"></div></div></div>',
                    iconSize: [48, 48],
                    iconAnchor: [24, 24]
                });
                carMarker = L.marker(userLatLng, { icon: carIcon }).addTo(map);
                map.setView(userLatLng, 18, { animate: true });
            } else {
                var startLatLng = [carMarker.getLatLng().lat, carMarker.getLatLng().lng];
                userLatLng = newLatLng;
                animateMarker(carMarker, startLatLng, userLatLng, 1200); // 1.2s smooth glide
                
                var arrow = document.getElementById('carArrow');
                if (arrow && bearing !== undefined) {
                    arrow.style.transform = 'rotate(' + bearing + 'deg)';
                }
            }

            if (isFirstLoc || follow || isNavigating) {
                map.panTo(userLatLng, { animate: true, duration: 1.2, easeLinearity: 1 });
            }
        };

        window.setDestination = function(lat, lng, title) {
            if (!map) return;
            var destLatLng = [lat, lng];
            if (destMarker) map.removeLayer(destMarker);
            
            var destIcon = L.divIcon({
                className: 'custom-dest-pin',
                html: '<div class="dest-marker"></div>',
                iconSize: [34, 34],
                iconAnchor: [17, 34]
            });
            
            destMarker = L.marker(destLatLng, { icon: destIcon }).addTo(map);

            if (userLatLng) {
                fetchRoute(userLatLng[0], userLatLng[1], lat, lng, false);
            } else {
                map.setView(destLatLng, 17, { animate: true });
            }
        };

        window.startTurnByTurn = function(lat, lng, title) {
            if (!userLatLng) {
                userLatLng = [12.9716, 77.5946];
            }
            isNavigating = true;
            fetchRoute(userLatLng[0], userLatLng[1], lat, lng, true);
        };

        function fetchRoute(startLat, startLng, endLat, endLng, startActiveNav) {
            var url = 'https://router.project-osrm.org/route/v1/driving/' + 
                      startLng + ',' + startLat + ';' + endLng + ',' + endLat + 
                      '?overview=full&geometries=geojson&steps=true';

            fetch(url)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                        var route = data.routes[0];
                        var coords = route.geometry.coordinates.map(function(c) { return [c[1], c[0]]; });

                        if (routePolylineBg) map.removeLayer(routePolylineBg);
                        if (routePolyline) map.removeLayer(routePolyline);

                        // Glowing Route Path for Automotive Night Theme
                        routePolylineBg = L.polyline(coords, {
                            color: '#005b66',
                            weight: 9,
                            opacity: 0.85,
                            lineCap: 'round',
                            lineJoin: 'round'
                        }).addTo(map);

                        routePolyline = L.polyline(coords, {
                            color: '#00e5ff',
                            weight: 5.5,
                            opacity: 1.0,
                            lineCap: 'round',
                            lineJoin: 'round'
                        }).addTo(map);

                        if (startActiveNav) {
                            map.setView(userLatLng, 18, { animate: true });
                        } else {
                            map.fitBounds(L.latLngBounds(coords), {
                                padding: [60, 60],
                                animate: true
                            });
                        }

                        // Parse maneuver steps for turn-by-turn guidance
                        currentSteps = [];
                        if (route.legs && route.legs.length > 0 && route.legs[0].steps) {
                            currentSteps = route.legs[0].steps;
                        }

                        var nextManeuver = (currentSteps.length > 1) ? currentSteps[1] : (currentSteps[0] || null);
                        var manType = nextManeuver ? (nextManeuver.maneuver ? nextManeuver.maneuver.type : 'straight') : 'straight';
                        var manMod = nextManeuver ? (nextManeuver.maneuver ? (nextManeuver.maneuver.modifier || 'straight') : 'straight') : 'straight';
                        var streetName = nextManeuver ? (nextManeuver.name || 'Continue on route') : 'Continue on route';
                        var stepDist = nextManeuver ? (nextManeuver.distance || 0) : 0;

                        if (window.AndroidBridge && window.AndroidBridge.onRouteCalculated) {
                            window.AndroidBridge.onRouteCalculated(
                                route.distance,
                                route.duration,
                                manType,
                                manMod,
                                streetName,
                                stepDist,
                                startActiveNav
                            );
                        }
                    }
                })
                .catch(function(err) {
                    console.error('OSRM Route fetch error:', err);
                });
        }

        window.endNavigation = function() {
            isNavigating = false;
            currentSteps = [];
            if (routePolylineBg) { map.removeLayer(routePolylineBg); routePolylineBg = null; }
            if (routePolyline) { map.removeLayer(routePolyline); routePolyline = null; }
            if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
            if (userLatLng) {
                map.setView(userLatLng, 17, { animate: true });
            }
        };

        window.clearDestination = function() {
            window.endNavigation();
        };

        window.centerUser = function() {
            if (map && userLatLng) {
                map.setView(userLatLng, isNavigating ? 18 : 17, { animate: true });
            }
        };

        window.setMapTheme = function(isDark) {
            if (isDark) {
                document.body.className = 'dark-tiles';
            } else {
                document.body.className = 'light-tiles';
            }
        };

        window.searchLocation = function(query, userLat, userLng) {
            var url1 = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(query) + '&format=json&limit=1';
            var url2 = 'https://photon.komoot.io/api/?q=' + encodeURIComponent(query) + (userLat && userLng ? ('&lat=' + userLat + '&lon=' + userLng) : '') + '&limit=1';

            fetch(url1)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data && data.length > 0) {
                        var first = data[0];
                        var lat = parseFloat(first.lat);
                        var lng = parseFloat(first.lon);
                        var name = first.name || query;
                        var fullAddress = first.display_name || name;

                        window.setDestination(lat, lng, name);

                        if (window.AndroidBridge && window.AndroidBridge.onDestinationFound) {
                            window.AndroidBridge.onDestinationFound(name, fullAddress, lat, lng);
                        }
                    } else {
                        fetch(url2)
                            .then(function(r) { return r.json(); })
                            .then(function(pData) {
                                if (pData.features && pData.features.length > 0) {
                                    var feat = pData.features[0];
                                    var fLng = feat.geometry.coordinates[0];
                                    var fLat = feat.geometry.coordinates[1];
                                    var fName = (feat.properties && feat.properties.name) ? feat.properties.name : query;
                                    var fCity = (feat.properties && feat.properties.city) ? feat.properties.city : '';
                                    var fAddress = fCity ? (fName + ', ' + fCity) : fName;

                                    window.setDestination(fLat, fLng, fName);

                                    if (window.AndroidBridge && window.AndroidBridge.onDestinationFound) {
                                        window.AndroidBridge.onDestinationFound(fName, fAddress, fLat, fLng);
                                    }
                                } else {
                                    if (window.AndroidBridge && window.AndroidBridge.onSearchError) {
                                        window.AndroidBridge.onSearchError('Location not found for: ' + query);
                                    }
                                }
                            });
                    }
                })
                .catch(function(err) {
                    console.error('Search error:', err);
                    if (window.AndroidBridge && window.AndroidBridge.onSearchError) {
                        window.AndroidBridge.onSearchError('Search failed');
                    }
                });
        };

        window.invalidateMapSize = function() {
            if (map) {
                map.invalidateSize(false);
            }
        };

        // Robust ResizeObserver to handle WebView container size changes dynamically
        if ('ResizeObserver' in window) {
            const resizeObserver = new ResizeObserver(() => {
                if (map) {
                    map.invalidateSize(false);
                }
            });
            resizeObserver.observe(document.body);
        }

        document.addEventListener('DOMContentLoaded', function() {
            initMap();
        });
    </script>
</body>
</html>
