name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Release Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Decode Keystore File (if configured)
        id: keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "keystore_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "keystore_configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Give Gradle Execute Permission
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/car-music.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/car-music.apk
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-music
          path: dist/car-music.apk

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/car-music.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Old APK Files from Prior Releases
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 -c "
          import os, urllib.request, json
          token = os.environ.get('GITHUB_TOKEN')
          repo = os.environ.get('GITHUB_REPOSITORY', 'aashikhameed/music-player-app')
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
          }
          try:
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/releases?per_page=100', headers=headers)
              with urllib.request.urlopen(req) as resp:
                  releases = json.loads(resp.read().decode('utf-8'))
              
              # Keep only the latest 2 releases with APKs, delete APKs from all older releases
              to_clean = releases[2:]
              deleted = 0
              for r in to_clean:
                  tag = r.get('tag_name')
                  for asset in r.get('assets', []):
                      if asset.get('name', '').endswith('.apk'):
                          asset_id = asset['id']
                          del_req = urllib.request.Request(
                              f'https://api.github.com/repos/{repo}/releases/assets/{asset_id}',
                              headers=headers,
                              method='DELETE'
                          )
                          try:
                              urllib.request.urlopen(del_req)
                              print(f'Deleted APK from {tag}: {asset.get(\"name\")}')
                              deleted += 1
                          except Exception as e:
                              print(f'Failed deleting asset {asset_id} from {tag}: {e}')
              print(f'Total old APK assets deleted: {deleted}')
          except Exception as e:
              print(f'Cleanup error: {e}')
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/release.keystore"
